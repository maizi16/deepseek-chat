<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>DeepSeek Chat</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --user:#2563eb; --ai:#232733; --text:#e6e8ee; --muted:#8b93a7; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; }

  header { padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background:var(--panel); display:flex; align-items:center; gap:10px;
    border-bottom:1px solid #262b36; position:sticky; top:0; z-index:10; }
  header h1 { font-size:16px; margin:0; flex:1; }
  header button { background:#2a3040; color:var(--text); border:none; border-radius:8px;
    padding:7px 12px; font-size:13px; }

  #chat { flex:1; overflow-y:auto; padding:14px; -webkit-overflow-scrolling:touch; }
  .msg { max-width:82%; padding:10px 13px; border-radius:16px; margin:8px 0;
    line-height:1.55; font-size:15px; white-space:pre-wrap; word-break:break-word; }
  .user { background:var(--user); margin-left:auto; border-bottom-right-radius:4px; }
  .ai   { background:var(--ai); margin-right:auto; border-bottom-left-radius:4px; }

  footer { padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
    background:var(--panel); display:flex; gap:8px; border-top:1px solid #262b36; }
  textarea { flex:1; resize:none; border:none; border-radius:12px; padding:10px 12px;
    background:#232733; color:var(--text); font-size:15px; font-family:inherit; max-height:120px; outline:none; }
  #send { background:var(--user); color:#fff; border:none; border-radius:12px;
    padding:0 18px; font-size:15px; font-weight:600; }
  #send:disabled { opacity:.5; }

  .mask { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; z-index:100; padding:20px; }
  .mask.show { display:flex; }
  .dialog { background:var(--panel); border-radius:16px; padding:18px; width:100%; max-width:380px; }
  .dialog h2 { margin:0 0 10px; font-size:16px; }
  .dialog p { color:var(--muted); font-size:13px; margin:0 0 10px; }
  .dialog input { width:100%; padding:10px; border-radius:10px; border:1px solid #2f3546;
    background:#232733; color:var(--text); font-size:14px; }
  .dialog .row { display:flex; gap:8px; margin-top:14px; }
  .dialog button { flex:1; padding:10px; border:none; border-radius:10px; font-size:14px; }
  .primary { background:var(--user); color:#fff; }
  .ghost { background:#2a3040; color:var(--text); }
</style>
</head>
<body>

<header>
  <h1>DeepSeek Chat</h1>
  <button id="setKey">设置 Key</button>
  <button id="clear">清空</button>
</header>

<div id="chat"></div>

<footer>
  <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
  <button id="send">发送</button>
</footer>

<div class="mask" id="mask">
  <div class="dialog">
    <h2>DeepSeek API Key</h2>
    <p>Key 仅保存在本机浏览器，不会上传到任何服务器。</p>
    <input id="keyInput" type="password" placeholder="sk-..." />
    <div class="row">
      <button class="ghost" id="cancelKey">取消</button>
      <button class="primary" id="saveKey">保存</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://api.deepseek.com/chat/completions';
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const mask = document.getElementById('mask');
const keyInput = document.getElementById('keyInput');

let messages = JSON.parse(localStorage.getItem('ds_messages') || '[]');
const getKey = () => localStorage.getItem('ds_key') || '';
const saveMessages = () => localStorage.setItem('ds_messages', JSON.stringify(messages));

function render() {
  chatEl.innerHTML = '';
  messages.forEach(m => addBubble(m.content, m.role === 'user' ? 'user' : 'ai'));
  chatEl.scrollTop = chatEl.scrollHeight;
}
function addBubble(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  return d;
}

// 首次进入检查 Key
if (!getKey()) mask.classList.add('show');
render();

document.getElementById('setKey').onclick = () => {
  keyInput.value = getKey();
  mask.classList.add('show');
};
document.getElementById('cancelKey').onclick = () => mask.classList.remove('show');
document.getElementById('saveKey').onclick = () => {
  const k = keyInput.value.trim();
  if (k) localStorage.setItem('ds_key', k);
  mask.classList.remove('show');
};
document.getElementById('clear').onclick = () => {
  if (confirm('清空所有对话？')) { messages = []; saveMessages(); render(); }
};

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  const key = getKey();
  if (!key) { mask.classList.add('show'); return; }

  messages.push({ role: 'user', content: text });
  saveMessages(); render();
  inputEl.value = ''; inputEl.style.height = 'auto';

  sendBtn.disabled = true;
  const aiEl = addBubble('', 'ai');

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: messages,
        stream: true
      })
    });

    if (!res.ok) {
      const err = await res.text();
      aiEl.textContent = '请求失败：' + res.status + '\n' + err;
      messages.pop();
      saveMessages();
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let answer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const data = t.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content || '';
          if (delta) {
            answer += delta;
            aiEl.textContent = answer;
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        } catch (e) {}
      }
    }

    messages.push({ role: 'assistant', content: answer });
    saveMessages();
  } catch (e) {
    aiEl.textContent = '网络错误：' + e.message;
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.onclick = send;
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 600) {
    e.preventDefault(); send();
  }
});
</script>
</body>
</html>
